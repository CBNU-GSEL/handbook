[project]
site_url = "https://cbnu-gsel.github.io/handbook/"
site_name = "GSEL Handbook"
site_description = "Public user documentation for GSEL research computing."

repo_url = "https://github.com/CBNU-GSEL/handbook"
repo_name = "CBNU-GSEL/handbook"
edit_uri = "edit/main/docs/"

nav = [
  { "Start Here" = "index.md" },
  { "Onboarding" = [
      { "GitHub account" = "onboarding/github-account.md" },
      { "GSEL sign-in" = "onboarding/gsel-sign-in.md" },
      { "First Coder workspace" = "onboarding/first-workspace.md" },
  ] },
  { "Coder" = [
      { "Create a workspace" = "coder/create-workspace.md" },
      { "Open in the browser" = "coder/open-in-browser.md" },
      { "Connect with the CLI" = "coder/cli.md" },
      { "Connect with SSH" = "coder/ssh.md" },
      { "Submit a compute run" = "coder/submit-compute.md" },
  ] },
  { "Reference" = [
      { "System overview" = "reference/system-overview.md" },
      { "Glossary" = "reference/glossary.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
